services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-brseai_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-dev-mongodb-root-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_APP_USERNAME: ${MONGODB_USERNAME:-brseai_app}
      MONGODB_APP_PASSWORD: ${MONGODB_PASSWORD:-dev-mongodb-password}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./ops/mongo/init-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./ops/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis

  # Private S3-compatible storage for local development (recordings + meeting archives).
  # RustFS speaks the S3 API with access keys; on AWS the bucket comes from Terraform.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-meetq-local}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-meetq-local-secret}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data

  # LiveKit Egress: server-side Room Composite recording, uploads MP4 straight to storage.
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    depends_on:
      - redis
      - livekit
      - s3
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devkeysecretdevkeysecretdevkey12}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        health_port: 9090
        cpu_cost:
          room_composite_cpu_cost: 1
        # Default upload target for every recording (requests carry only the object key).
        storage:
          s3:
            access_key: ${LOCAL_S3_ACCESS_KEY:-meetq-local}
            secret: ${LOCAL_S3_SECRET_KEY:-meetq-local-secret}
            region: us-east-1
            endpoint: http://s3:9000
            bucket: ${MEETING_ARCHIVE_BUCKET:-meetq-archive-local}
            force_path_style: true

  gateway:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "uvicorn", "server.service.gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    working_dir: /app
    volumes:
      - ./BE:/app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dev-openai-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o-mini}
      MEETING_SUMMARY_LANGUAGE: ${MEETING_SUMMARY_LANGUAGE:-en}
      MEETING_SUMMARY_MAX_SOURCE_ITEMS: ${MEETING_SUMMARY_MAX_SOURCE_ITEMS:-240}
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: ${MONGODB_URL:-}
      MONGODB_HOST: ${MONGODB_HOST:-mongo}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-brseai_app}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-dev-mongodb-password}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-}
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-dev-room-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devkeysecretdevkeysecretdevkey12}
      LIVEKIT_WS_URL_PUBLIC: ${LIVEKIT_WS_URL_PUBLIC:-ws://localhost:7880}
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
      PUBLIC_GATEWAY_WS_URL: ${PUBLIC_GATEWAY_WS_URL:-}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_NOTIFY_ROOM_CREATED: ${TELEGRAM_NOTIFY_ROOM_CREATED:-true}
      TELEGRAM_NOTIFY_PARTICIPANT_JOINED: ${TELEGRAM_NOTIFY_PARTICIPANT_JOINED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-3}
      ROOM_MEETING_DURATION_SECONDS: ${ROOM_MEETING_DURATION_SECONDS:-3600}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-0}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      USER_SESSION_TTL_SECONDS: ${USER_SESSION_TTL_SECONDS:-1209600}
      USER_AUTH_REQUIRED: ${USER_AUTH_REQUIRED:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      OPS_EVENT_RETENTION_DAYS: ${OPS_EVENT_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TRANSCRIPTS: ${LOG_TRANSCRIPTS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Meeting recording + archive: local RustFS stands in for the private S3 bucket.
      MEETING_ARCHIVE_BUCKET: ${MEETING_ARCHIVE_BUCKET:-meetq-archive-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-meetq-local}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-meetq-local-secret}
      S3_ENDPOINT_URL: http://s3:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_CREATE_BUCKET: "true"
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: ""
      MEETING_RECORDING_ENABLED: ${MEETING_RECORDING_ENABLED:-true}
      DEFAULT_MEETING_RETENTION_DAYS: ${DEFAULT_MEETING_RETENTION_DAYS:-7}
      DEPLOYMENT_ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo
      - livekit

  interpreter:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "server.service.brain_runtime.main"]
    working_dir: /app
    volumes:
      - ./BE:/app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dev-openai-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      REDIS_URL: redis://redis:6379/0
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-dev-room-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devkeysecretdevkeysecretdevkey12}
      LIVEKIT_WS_URL_PUBLIC: ${LIVEKIT_WS_URL_PUBLIC:-ws://localhost:7880}
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      REALTIME_INPUT_SAMPLE_RATE: ${REALTIME_INPUT_SAMPLE_RATE:-24000}
      REALTIME_OUTPUT_SAMPLE_RATE: ${REALTIME_OUTPUT_SAMPLE_RATE:-24000}
      LIVEKIT_LINE_ISOLATION_ENABLED: ${LIVEKIT_LINE_ISOLATION_ENABLED:-true}
      LIVEKIT_LINE_LOOKAHEAD_MS: ${LIVEKIT_LINE_LOOKAHEAD_MS:-120}
      LIVEKIT_LINE_CROSSTALK_CORRELATION: ${LIVEKIT_LINE_CROSSTALK_CORRELATION:-0.75}
      LIVEKIT_LINE_CROSSTALK_DOMINANCE_DB: ${LIVEKIT_LINE_CROSSTALK_DOMINANCE_DB:-4.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TRANSCRIPTS: ${LOG_TRANSCRIPTS:-false}
    depends_on:
      - redis
      - livekit

volumes:
  mongo_data:
  s3_data:
