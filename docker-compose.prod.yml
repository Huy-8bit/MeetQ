name: brseai-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - fe
      - gateway
      - livekit
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./ops/nginx/meetqapp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certbot/www:/var/www/certbot:ro
      - ${SSL_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro

  fe:
    build:
      context: ./FE
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?set-mongodb-root-username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?set-mongodb-root-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_APP_USERNAME: ${MONGODB_USERNAME:?set-mongodb-username}
      MONGODB_APP_PASSWORD: ${MONGODB_PASSWORD:?set-mongodb-password}
    expose:
      - "27017"
    # Loopback only: lets the host-side backup tool (scripts/db-backup.sh) reach MongoDB
    # without exposing it to the network.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./ops/mongo/init-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-replace-with-livekit-api-key}: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}"
    volumes:
      - ./ops/livekit/livekit.prod.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    expose:
      - "7880"
    depends_on:
      - redis

  # LiveKit Egress: server-side Room Composite recording; uploads MP4 straight to S3.
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    depends_on:
      - redis
      - livekit
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-replace-with-livekit-api-key}
        api_secret: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 9090
        storage:
          s3:
            access_key: ${ARCHIVE_AWS_ACCESS_KEY_ID:-}
            secret: ${ARCHIVE_AWS_SECRET_ACCESS_KEY:-}
            region: ${AWS_REGION:-ap-southeast-1}
            bucket: ${MEETING_ARCHIVE_BUCKET:-}

  gateway:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "uvicorn", "server.service.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://meetqapp.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-with-openai-api-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o-mini}
      MEETING_SUMMARY_LANGUAGE: ${MEETING_SUMMARY_LANGUAGE:-en}
      MEETING_SUMMARY_MAX_SOURCE_ITEMS: ${MEETING_SUMMARY_MAX_SOURCE_ITEMS:-240}
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: ${MONGODB_URL:-}
      MONGODB_HOST: ${MONGODB_HOST:-mongo}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brseai}
      MONGODB_USERNAME: ${MONGODB_USERNAME:?set-mongodb-username}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?set-mongodb-password}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-}
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-replace-with-room-jwt-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      ROOM_MEETING_DURATION_SECONDS: ${ROOM_MEETING_DURATION_SECONDS:-1800}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-0}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-livekit-api-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}
      LIVEKIT_WS_URL_PUBLIC: wss://rtc.meetqapp.com
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      PUBLIC_APP_URL: https://meetqapp.com
      PUBLIC_GATEWAY_URL: https://meetqapp.com
      PUBLIC_GATEWAY_WS_URL: wss://meetqapp.com
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_NOTIFY_ROOM_CREATED: ${TELEGRAM_NOTIFY_ROOM_CREATED:-true}
      TELEGRAM_NOTIFY_PARTICIPANT_JOINED: ${TELEGRAM_NOTIFY_PARTICIPANT_JOINED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-3}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      USER_SESSION_TTL_SECONDS: ${USER_SESSION_TTL_SECONDS:-1209600}
      USER_AUTH_REQUIRED: ${USER_AUTH_REQUIRED:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # Meeting recording + archive (private S3, infra/terraform/storage).
      MEETING_ARCHIVE_BUCKET: ${MEETING_ARCHIVE_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${ARCHIVE_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${ARCHIVE_AWS_SECRET_ACCESS_KEY:-}
      MEETING_RECORDING_ENABLED: ${MEETING_RECORDING_ENABLED:-true}
      DEFAULT_MEETING_RETENTION_DAYS: ${DEFAULT_MEETING_RETENTION_DAYS:-7}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-prod}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      OPS_EVENT_RETENTION_DAYS: ${OPS_EVENT_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    depends_on:
      - redis
      - mongo
      - livekit

  interpreter:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "server.service.brain_runtime.main"]
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-with-openai-api-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      REDIS_URL: redis://redis:6379/0
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-replace-with-room-jwt-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-livekit-api-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      REALTIME_INPUT_SAMPLE_RATE: ${REALTIME_INPUT_SAMPLE_RATE:-24000}
      REALTIME_OUTPUT_SAMPLE_RATE: ${REALTIME_OUTPUT_SAMPLE_RATE:-24000}
      LIVEKIT_LINE_ISOLATION_ENABLED: ${LIVEKIT_LINE_ISOLATION_ENABLED:-true}
      LIVEKIT_LINE_LOOKAHEAD_MS: ${LIVEKIT_LINE_LOOKAHEAD_MS:-120}
      LIVEKIT_LINE_CROSSTALK_CORRELATION: ${LIVEKIT_LINE_CROSSTALK_CORRELATION:-0.75}
      LIVEKIT_LINE_CROSSTALK_DOMINANCE_DB: ${LIVEKIT_LINE_CROSSTALK_DOMINANCE_DB:-4.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - livekit

volumes:
  mongo_data:
