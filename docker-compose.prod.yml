name: brseai-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - fe
      - gateway
      - livekit
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./ops/nginx/meetqapp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certbot/www:/var/www/certbot:ro
      - ${SSL_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro

  fe:
    build:
      context: ./FE
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  mongo:
    image: mongo:7
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-replace-with-livekit-api-key}: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}"
    volumes:
      - ./ops/livekit/livekit.prod.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    expose:
      - "7880"
    depends_on:
      - redis

  gateway:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "uvicorn", "server.service.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-with-openai-api-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-mini}
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brseai}
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-replace-with-room-jwt-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      ROOM_MEETING_DURATION_SECONDS: ${ROOM_MEETING_DURATION_SECONDS:-1800}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-0}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-livekit-api-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}
      LIVEKIT_WS_URL_PUBLIC: wss://rtc.meetqapp.com
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      PUBLIC_APP_URL: https://meetqapp.com
      PUBLIC_GATEWAY_URL: https://meetqapp.com
      PUBLIC_GATEWAY_WS_URL: wss://meetqapp.com
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_NOTIFY_ROOM_CREATED: ${TELEGRAM_NOTIFY_ROOM_CREATED:-true}
      TELEGRAM_NOTIFY_PARTICIPANT_JOINED: ${TELEGRAM_NOTIFY_PARTICIPANT_JOINED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    depends_on:
      - redis
      - mongo
      - livekit

  interpreter:
    build:
      context: ./BE
    restart: unless-stopped
    command: ["-m", "server.service.brain_runtime.main"]
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-with-openai-api-key}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-mini}
      REDIS_URL: redis://redis:6379/0
      ROOM_JWT_SECRET: ${ROOM_JWT_SECRET:-replace-with-room-jwt-secret}
      ROOM_TOKEN_TTL_SECONDS: ${ROOM_TOKEN_TTL_SECONDS:-86400}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-livekit-api-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret}
      LIVEKIT_WS_URL_INTERNAL: ws://livekit:7880
      REALTIME_INPUT_SAMPLE_RATE: ${REALTIME_INPUT_SAMPLE_RATE:-16000}
      REALTIME_OUTPUT_SAMPLE_RATE: ${REALTIME_OUTPUT_SAMPLE_RATE:-24000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - livekit

volumes:
  mongo_data:
