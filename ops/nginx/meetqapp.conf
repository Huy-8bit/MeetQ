map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream meetqapp_fe {
    server fe:80;
    keepalive 32;
}

upstream meetqapp_gateway {
    server gateway:8000;
    keepalive 32;
}

upstream meetqapp_livekit {
    server livekit:7880;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meetqapp.com www.meetqapp.com rtc.meetqapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meetqapp.com www.meetqapp.com;

    # Mount certificates at these paths, for example via certbot or another ACME client.
    ssl_certificate /etc/letsencrypt/live/meetqapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetqapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location /api/ {
        proxy_pass http://meetqapp_gateway;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://meetqapp_gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://meetqapp_fe;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rtc.meetqapp.com;

    # Mount certificates at these paths, for example via certbot or another ACME client.
    ssl_certificate /etc/letsencrypt/live/rtc.meetqapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.meetqapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location / {
        proxy_pass http://meetqapp_livekit;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
